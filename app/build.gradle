plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.appcel'
    compileSdk 35

    defaultConfig {
        applicationId "com.appcel"
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // Misma firma en cada compilación, así las actualizaciones se instalan encima.
    signingConfigs {
        shared {
            storeFile rootProject.file("keystore/appcel.keystore")
            storePassword "appcel-key"
            keyAlias "appcel"
            keyPassword "appcel-key"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
