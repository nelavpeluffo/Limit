name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Publicar el APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Limit.apk
          gh release create "v1.0.${{ github.run_number }}" Limit.apk \
            --title "Limit v1.0.${{ github.run_number }}" \
            --notes "Descargá **Limit.apk** desde el celular e instalalo. Las versiones nuevas se instalan encima de la anterior." \
            --latest
